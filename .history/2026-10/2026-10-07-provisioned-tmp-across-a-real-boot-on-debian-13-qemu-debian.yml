    - "packer validate and packer fmt -check pass on the final template"
    - "Built the template twice independently; both build logs showed findmnt reporting /tmp as tmpfs before Hello, World!; artifacts were 1349517312 and 1343094784 bytes"
    - "Booted the first build's artifact with -snapshot and the iid-verify-01 seed: /tmp tmpfs, on-disk /tmp after umount holding only . and .. with mtime Oct 1 04:57, tree v2.2.1, packer locked (L), sshd_config.d empty, passwordauthentication no"
    - "Booted the second build's artifact the same way with identical results on every check"

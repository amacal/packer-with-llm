    - "Considered passing the key as sh -c positional parameters; ruled out because {{ .Vars }} is pre-formatted text, not the raw key"
    - "Checked ssh-add -L output with no reachable agent (stderr message, empty stdout, exit 2) and that an empty -var value counts as set"
    - "Decided on a validation regex, against sensitive, and to strip the key comment in the Makefile"
    - "Discussed what -force deletes and when, and that packer validate runs builder configuration checks including the output directory"

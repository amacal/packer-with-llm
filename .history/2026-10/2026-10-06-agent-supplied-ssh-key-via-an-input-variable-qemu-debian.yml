  corrections:
    - "Predicted packer validate would pass with required = true and the variable unset; observed 'Unsupported argument' for required and an invalid error_message sentence"
    - "Predicted $(...) in the Makefile would run the pipeline in a shell; observed make -n showing ssh_public_key= empty, because $(...) is a Make variable reference"
    - "Predicted -var ssh_public_key= would pass validation; observed the validation rule rejecting it with its error_message"

  bugs_found:
    - "required = true is not a valid variable argument; resolved by removing it (no default already makes the variable required)"
    - "error_message did not start with an uppercase letter; resolved by rewriting it as a full sentence"
    - "Makefile used $(...) instead of $(shell ...), passing an empty key; resolved"
    - "execute_command sourced the env file outside sudo, so the root shell lacked SSH_PUBLIC_KEY and authorized_keys got an empty line while the build reported success; resolved by sourcing inside sudo sh -c"

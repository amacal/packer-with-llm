claim: "A file written to /tmp by a shell provisioner is present in the final artifact"
status: "confirmed on docker (ubuntu:24.04 and rockylinux:9) across independent builds; on qemu/debian 12 the file is absent after the artifact's first standalone boot (deleted by systemd-tmpfiles 'D /tmp' with --remove), verified across 2 independent builds, its presence inside the qcow2 before first boot inferred but not directly observed; on qemu/debian 13 the file never reaches the qcow2 (tmp.mount puts /tmp on tmpfs during the build boot), verified across 2 independent builds by unmounting /tmp on the booted artifact and finding the on-disk directory empty with the base image's mtime"
